[project]
name = "predictive-cybercrime-intelligence"
version = "0.1.0"
description = "Predictive Analytics Framework for Cybercrime Complaints to Forecast Likely Cash Withdrawal Locations in Advance"
authors = [
    {name = "Team"}
]
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.26",
    "pydantic>=2.0.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
